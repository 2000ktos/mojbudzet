<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#6C5CE7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budżet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
<title>Budżet</title>
<style>
:root{
  --bg:#f4f5fa;--card:#ffffff;--text:#1b1d2a;--muted:#7f859c;--line:#e8eaf2;--track:#eceef6;
  --accent:#6C5CE7;--accent2:#a29bfe;--ok:#00b894;--warn:#f39c12;--bad:#e74c3c;
  --shadow:0 6px 24px rgba(30,30,60,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f1117;--card:#181b25;--text:#f1f2f7;--muted:#8a90a6;--line:#262a38;--track:#232736;--shadow:0 6px 24px rgba(0,0,0,.38)}
}
:root[data-theme="dark"]{--bg:#0f1117;--card:#181b25;--text:#f1f2f7;--muted:#8a90a6;--line:#262a38;--track:#232736;--shadow:0 6px 24px rgba(0,0,0,.38)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
body{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit;padding:0}
input,textarea,select{font:inherit;color:var(--text)}
#app{max-width:560px;margin:0 auto;padding:0 16px}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.top-l{display:flex;align-items:center;gap:8px;min-width:0}
.top h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.sync-pill{font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px;background:var(--card);color:var(--muted);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.sync-pill.ok{color:var(--ok)}
.sync-pill.warn{color:var(--warn)}
.sync-pill.bad{color:var(--bad)}
.msw{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:3px;flex:none}
.msw button{width:30px;height:30px;border-radius:50%;font-size:18px;color:var(--muted);display:grid;place-items:center}
.msw span{min-width:96px;text-align:center;font-weight:700;font-size:13px;padding:0 4px}
.msw.yr span{min-width:56px}

/* Pills */
.pills{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:8px 13px;border-radius:99px;background:var(--card);color:var(--muted);font-size:13px;font-weight:700;box-shadow:var(--shadow);border:2px solid transparent;transition:.2s}
.pill.on{background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--accent);border-color:var(--accent)}

/* Cards & Hero */
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:26px;padding:20px;margin-bottom:12px;box-shadow:0 14px 34px color-mix(in srgb,var(--accent) 34%,transparent);transition:background .3s}
.hero.over{background:linear-gradient(135deg,#e74c3c,#c0392b);box-shadow:0 14px 34px rgba(231,76,60,.36)}
.hero .lbl{opacity:.92;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-1px;margin:4px 0 12px}
.hbar{height:9px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}
.hbar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s}
.hrow{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;gap:8px}
.hrow b{display:block;font-size:15px;margin-top:1px}
.hrow .r{text-align:right}
.hsub{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);font-size:12px;opacity:.95;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Quick buttons & sections */
.qbtns{display:flex;gap:8px;margin-bottom:12px}
.qbtns .btn{flex:1;padding:11px 10px;font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;font-weight:700;padding:12px 18px;border-radius:14px;transition:opacity .15s}
.btn:active{opacity:.82}
.btn.ghost{background:var(--track);color:var(--text)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:color-mix(in srgb,var(--bad) 15%,var(--card));color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:11px}
.btn.full{width:100%}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}
.sec h2{font-size:15.5px;margin:0;font-weight:800}
.sec button{color:var(--accent);font-weight:700;font-size:13px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}

/* Weekly grid */
.wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.wbox{background:var(--track);border-radius:14px;padding:9px 5px;text-align:center;border:2px solid transparent;transition:.2s}
.wbox.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.wbox.neg{background:color-mix(in srgb,var(--bad) 11%,var(--card))}
.wbox.pos{background:color-mix(in srgb,var(--ok) 11%,var(--card))}
.wbox small{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.wbox b{display:block;font-size:12.5px;margin-top:3px;font-weight:800}
.wbox span{display:block;font-size:10px;margin-top:2px;font-weight:700;color:var(--muted)}
.wbox.neg b{color:var(--bad)}
.wbox.pos b{color:var(--ok)}

/* Surplus / Inbox banner */
.banner{border-radius:18px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.banner.ok{background:color-mix(in srgb,var(--ok) 13%,var(--card));border:1.5px solid color-mix(in srgb,var(--ok) 45%,transparent)}
.banner.accent{background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1.5px solid color-mix(in srgb,var(--accent) 42%,transparent)}
.banner .bt{font-size:13px;line-height:1.35}
.banner .bt b{display:block;font-size:13.5px}

/* Rows & bars */
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}
.amt{font-weight:800;font-size:14.5px;white-space:nowrap;text-align:right}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--track);color:var(--muted)}
.tag.shared{background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--accent)}
.tag.src{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn)}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,var(--card));color:var(--ok)}
.day{font-size:12px;color:var(--muted);font-weight:700;margin:14px 4px 6px;text-transform:capitalize}
.empty{text-align:center;color:var(--muted);padding:34px 18px;font-size:13.5px;line-height:1.5}
.empty b{display:block;font-size:34px;margin-bottom:6px}

/* Balance equation card */
.eq{display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.eq-r{display:flex;justify-content:space-between;align-items:center}
.eq-r.tot{border-top:1.5px solid var(--line);padding-top:9px;margin-top:3px;font-size:15.5px;font-weight:800}

/* Charts */
.barchart-wrap{position:relative;padding-top:2px}
.bar-detail{background:var(--track);border-radius:14px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar-detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;font-size:12px}
.bar-detail-grid div b{display:block;font-size:13.5px;margin-top:1px}
.gchart-svg{width:100%;height:auto;display:block;overflow:visible;user-select:none;-webkit-user-select:none}
.gchart-col{cursor:pointer}
.gchart-leg{margin-top:10px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:600}
.gchart-leg span{display:inline-flex;align-items:center;gap:5px}
.gchart-sw{display:inline-block;width:10px;height:10px;border-radius:3px}
.gchart-ln{display:inline-block;width:16px;height:0;border-top:2.5px dashed var(--warn)}

.pie-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.pie-leg{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px}
.pie-item{display:flex;align-items:center;gap:8px;font-size:13px}
.pie-dot{width:11px;height:11px;border-radius:50%;flex:none}
.pie-item b{margin-left:auto;font-size:13px;white-space:nowrap}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 62px 1fr 1fr 1fr;align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;font-size:10.5px;color:var(--muted);font-weight:700}
.nav button span{font-size:20px;filter:grayscale(.9);opacity:.72}
.nav button.on{color:var(--accent)}
.nav button.on span{filter:none;opacity:1}
.nav .plus{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:30px;line-height:1;margin:-26px auto 0;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 45%,transparent);display:grid;place-items:center}

/* Bottom Sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:35;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(10,12,24,.52);opacity:0;pointer-events:none;transition:opacity .22s;z-index:34}
body.so #scrim{opacity:1;pointer-events:auto}
.sheetin{max-width:560px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:89vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.28)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheetin h3{margin:0 0 12px;font-size:18px;font-weight:800}
.fl{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:11px 2px 5px}
.in{width:100%;background:var(--track);border:2px solid transparent;border-radius:13px;padding:12px 13px;font-size:15.5px;outline:0}
.in:focus{border-color:var(--accent)}
.in.big{font-size:30px;font-weight:800;text-align:center;padding:13px}
textarea.in{min-height:86px;resize:vertical;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:8px 11px;border-radius:99px;background:var(--track);font-size:13px;font-weight:700;border:2px solid transparent}
.chips button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--accent)}
.sbtns{display:flex;gap:8px;margin-top:18px}
.sbtns .btn{flex:1}
.sbtns .del{flex:none;width:48px;background:color-mix(in srgb,var(--bad) 15%,var(--card));color:var(--bad)}

/* Shared Voles Toggle */
.vole-box{margin-top:12px;padding:11px 13px;border-radius:16px;background:var(--track);border:2px solid transparent;display:flex;align-items:center;gap:12px;width:100%;transition:.2s}
.vole-box.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.vole-art{width:64px;height:44px;flex:none;display:grid;place-items:center}
.vole-txt{flex:1;min-width:0}
.vole-txt b{display:block;font-size:14px}
.vole-txt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.vole-box.on .vole-txt small{color:var(--accent);font-weight:700}
.sw-knob{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw-knob::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.vole-box.on .sw-knob{background:var(--accent)}
.vole-box.on .sw-knob::after{transform:translateX(18px)}

/* Settings helpers */
.seg{display:flex;background:var(--track);border-radius:11px;padding:3px;gap:3px}
.seg button{padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots button{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
.dots button.on{border-color:var(--text);transform:scale(1.08)}
.toggle{width:44px;height:26px;border-radius:99px;background:var(--track);position:relative;flex:none;transition:.2s}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.22)}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(18px)}

/* Auth overlay */
#auth{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
#auth.open{display:flex}
.auth-card{width:100%;max-width:400px;background:var(--card);border-radius:26px;padding:26px 22px;box-shadow:var(--shadow)}
.auth-logo{width:62px;height:62px;border-radius:18px;margin:0 auto 12px;display:block}
.auth-card h2{text-align:center;margin:0 0 6px;font-size:22px;font-weight:800}
.auth-card p{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 18px}
.auth-err{background:color-mix(in srgb,var(--bad) 13%,var(--card));color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;display:none}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,18px);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:15px;font-size:13px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--bad);color:#fff}

/* Cuddling Voles Celebration Overlay */
#volePop{
  position:fixed;inset:0;z-index:80;
  display:grid;place-items:center;padding:24px;
  background:rgba(14,16,28,.46);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity .28s ease;
}
#volePop.open{opacity:1;pointer-events:auto}
.vole-pop-card{
  width:min(310px,100%);background:var(--card);border-radius:30px;
  padding:20px 18px 22px;text-align:center;
  box-shadow:0 24px 60px rgba(15,18,40,.35);
  border:2px solid color-mix(in srgb,var(--accent) 26%,var(--line));
  transform:scale(.76) translateY(16px);
  transition:transform .38s cubic-bezier(.34,1.56,.64,1);
}
#volePop.open .vole-pop-card{transform:scale(1) translateY(0)}
.vole-pop-stage{width:240px;height:156px;margin:0 auto 4px;display:grid;place-items:center;overflow:visible}
.vole-pop-title{font-size:17px;font-weight:800;letter-spacing:-.2px;margin:2px 0 6px}
.vole-pop-amt{
  display:inline-block;padding:6px 14px;border-radius:99px;
  background:color-mix(in srgb,var(--accent) 15%,var(--card));
  color:var(--accent);font-weight:800;font-size:15.5px;
}
.vole-pop-sub{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}

/* Vole SVG hug keyframes */
@keyframes vLeftHug{
  0%{transform:translate(-26px,4px) rotate(-6deg) scale(.96)}
  34%{transform:translate(3px,0) rotate(3deg) scale(1.03,.97)}
  52%{transform:translate(0,0) rotate(1.5deg) scale(1)}
  72%{transform:translate(2px,-1px) rotate(3deg) scale(1.01,.99)}
  100%{transform:translate(0,0) rotate(1deg) scale(1)}
}
@keyframes vRightHug{
  0%{transform:translate(26px,4px) rotate(6deg) scale(.96)}
  34%{transform:translate(-3px,0) rotate(-3deg) scale(1.03,.97)}
  52%{transform:translate(0,0) rotate(-1.5deg) scale(1)}
  72%{transform:translate(-2px,-1px) rotate(-3deg) scale(1.01,.99)}
  100%{transform:translate(0,0) rotate(-1deg) scale(1)}
}
@keyframes vHeartPop{
  0%{opacity:0;transform:translateY(14px) scale(.25)}
  30%{opacity:1;transform:translateY(-4px) scale(1.15)}
  70%{opacity:1;transform:translateY(-14px) scale(.96)}
  100%{opacity:0;transform:translateY(-24px) scale(.8)}
}
@keyframes vSparkle{
  0%,100%{opacity:0;transform:scale(.4) rotate(0deg)}
  45%{opacity:1;transform:scale(1.1) rotate(18deg)}
}
#volePop.open .v-left{transform-origin:95px 115px;animation:vLeftHug 1.35s cubic-bezier(.22,1,.36,1) forwards}
#volePop.open .v-right{transform-origin:145px 115px;animation:vRightHug 1.35s cubic-bezier(.22,1,.36,1) forwards}
#volePop.open .v-h1{transform-origin:120px 38px;opacity:0;animation:vHeartPop 1.5s .22s ease-out forwards}
#volePop.open .v-h2{transform-origin:92px 50px;opacity:0;animation:vHeartPop 1.4s .38s ease-out forwards}
#volePop.open .v-h3{transform-origin:148px 48px;opacity:0;animation:vHeartPop 1.4s .52s ease-out forwards}
#volePop.open .v-sp1{transform-origin:52px 52px;opacity:0;animation:vSparkle 1.3s .3s ease-in-out infinite}
#volePop.open .v-sp2{transform-origin:190px 56px;opacity:0;animation:vSparkle 1.3s .65s ease-in-out infinite}

</style>
</head>
<body>

<div id="auth">
  <div class="auth-card">
    <img src="icon.svg" alt="" class="auth-logo">
    <h2 id="authTitle">Budżet</h2>
    <p>Zaloguj się swoim prywatnym kontem, aby zsynchronizować dane w chmurze.</p>
    <div id="authErr" class="auth-err"></div>
    <label class="fl">Email</label>
    <input class="in" id="a_email" type="email" autocomplete="email" placeholder="twoj@email.pl">
    <label class="fl">Hasło</label>
    <input class="in" id="a_pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn full" id="a_btn" style="margin-top:18px">Zaloguj się</button>
    <button class="btn ghost full" id="a_offline" style="margin-top:10px;display:none">Kontynuuj offline</button>
  </div>
</div>

<div id="app"></div>

<div class="nav">
  <div class="nav-in" id="nav"></div>
</div>

<div id="sheet">
  <div class="sheetin">
    <div class="grab"></div>
    <h3 id="sheetT"></h3>
    <div id="sheetB"></div>
    <div class="sbtns">
      <button class="btn del" id="sheetDel" data-a="sheetDel" aria-label="Usuń">🗑</button>
      <button class="btn ghost" data-a="sheetClose">Anuluj</button>
      <button class="btn" id="sheetOk" data-a="sheetOk">Zapisz</button>
    </div>
  </div>
</div>
<div id="scrim" data-a="sheetClose"></div>
<div id="toast"></div>
<div id="volePop" role="dialog" aria-live="polite">
  <div class="vole-pop-card">

function parseNum(v){
  const s = String(v == null ? '' : v).replace(/\s/g,'').replace(/,/g,'.');
  if(!s) return NaN;
  if(/^[0-9.+\-]+$/.test(s) && (s.includes('+') || s.slice(1).includes('-'))){
    try{
      const parts = s.match(/[+\-]?[0-9.]+/g);
      if(parts && parts.length){
        const tot = parts.reduce((acc,p) => acc + parseFloat(p), 0);
        return isFinite(tot) ? r2(tot) : NaN;
      }
    }catch(e){}
  }
  const x = parseFloat(s);
  return isFinite(x) ? r2(x) : NaN;
}

function todayStr(){
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function parseISO(s){
  const p = String(s).split('-').map(Number);
  return new Date(p[0], p[1]-1, p[2]);
}
function toISO(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDays(iso, n){
  const d = parseISO(iso);
  d.setDate(d.getDate() + n);
  return toISO(d);
}
function diffDays(a, b){
  return Math.round((parseISO(b) - parseISO(a)) / 86400000);
}
function currentCycleKey(payday){
  const d = new Date();
  let y = d.getFullYear(), m = d.getMonth() + 1;
  if(d.getDate() < payday){ m--; if(m < 1){ m = 12; y--; } }
  return y + '-' + String(m).padStart(2,'0');
}
function shiftCycle(ck, delta){
  let [y,m] = ck.split('-').map(Number);
  m += delta;
  while(m > 12){ m -= 12; y++; }
  while(m < 1){ m += 12; y--; }
  return y + '-' + String(m).padStart(2,'0');
}
function cycleBounds(ck, payday){
  const [y,m] = ck.split('-').map(Number);
  const pd = Math.max(1, Math.min(28, Number(payday)||10));
  const start = new Date(y, m-1, pd);
  let end;
  if(pd === 1){
    end = new Date(y, m, 0);
  }else{
    end = new Date(y, m, pd - 1);
  }
  return { start: toISO(start), end: toISO(end) };
}
function cycleLabel(ck){
  const [y,m] = ck.split('-').map(Number);
  return MONTHS_PL[m-1] + ' ' + y;
}
function fmtShortDate(iso){
  const p = iso.split('-');
  return p[2] + '.' + p[1];
}
function dayLabel(iso){
  const t = todayStr();
  if(iso === t) return 'Dziś';
  if(iso === addDays(t, -1)) return 'Wczoraj';
  const d = parseISO(iso);
  return d.toLocaleDateString('pl-PL', {weekday:'long', day:'numeric', month:'long'});
}
function cycleKeyForDate(iso, payday){
  const pd = Math.max(1, Math.min(28, Number(payday)||10));
  const p = iso.split('-').map(Number);
  let y = p[0], m = p[1], day = p[2];
  if(day < pd){ m--; if(m < 1){ m = 12; y--; } }
  return y + '-' + String(m).padStart(2,'0');
}

function normalizeState(raw){
  if(!raw || typeof raw !== 'object') return defaultState();
  const d = defaultState();
  const s = Object.assign(d, raw);
  s.budgets = Object.assign(d.budgets, raw.budgets || {});
  if(!Array.isArray(s.budgets.weeks) || s.budgets.weeks.length !== 5) s.budgets.weeks = [200,200,200,200,100];
  if(!Array.isArray(s.incomesTemplate)) s.incomesTemplate = d.incomesTemplate;
  if(!Array.isArray(s.recurring)) s.recurring = d.recurring;
  if(!Array.isArray(s.pillars)) s.pillars = d.pillars;
  if(!s.goals || typeof s.goals !== 'object') s.goals = d.goals;
  if(!s.cycles || typeof s.cycles !== 'object') s.cycles = {};
  if(!Array.isArray(s.expenses)) s.expenses = [];
  if(!Array.isArray(s.wealthMoves)) s.wealthMoves = [];
  if(!s.valuations || typeof s.valuations !== 'object') s.valuations = {};
  return s;
}

  CFG.SUPABASE_URL &&
  CFG.SUPABASE_ANON_KEY &&
  String(CFG.SUPABASE_URL).startsWith('https://') &&
  !String(CFG.SUPABASE_URL).includes('TUTAJ_WKLEJ') &&
  !String(CFG.SUPABASE_ANON_KEY).includes('TUTAJ_WKLEJ') &&
  window.supabase
);

let sb = null;
let session = null;
let syncState = CLOUD_READY ? 'idle' : 'local'; // local | idle | syncing | ok | offline | error
let lastSyncAt = null;
let syncTimer = null;
let inboxItems = [];

function isDirty(){ return localStorage.getItem(DIRTY_KEY) === '1'; }
function setDirty(v){ try{ localStorage.setItem(DIRTY_KEY, v ? '1' : '0'); }catch(e){} }

function saveLocal(markDirty){
  S.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){}
  if(markDirty !== false){
    setDirty(true);
    schedulePush();
  }
}

function schedulePush(){
  if(!CLOUD_READY || !session) return;
  if(!navigator.onLine){ syncState = 'offline'; updateSyncPill(); return; }
  clearTimeout(syncTimer);
  syncState = 'syncing';
  updateSyncPill();
  syncTimer = setTimeout(() => pushToCloud(), 900);
}

async function pushToCloud(){
  if(!sb || !session) return false;
  if(!navigator.onLine){ syncState = 'offline'; updateSyncPill(); return false; }
  syncState = 'syncing';
  updateSyncPill();
  try{
    const { error } = await sb.from('app_state').upsert({
      user_id: session.user.id,
      data: S,
      updated_at: S.updatedAt
    }, { onConflict: 'user_id' });
    if(error) throw error;
    setDirty(false);
    syncState = 'ok';
    lastSyncAt = new Date();
    updateSyncPill();
    return true;
  }catch(err){
    syncState = navigator.onLine ? 'error' : 'offline';
    updateSyncPill();
    return false;
  }
}

async function pullOrSyncCloud(silent){
  if(!sb || !session) return;
  if(!navigator.onLine){ syncState = 'offline'; updateSyncPill(); return; }
  syncState = 'syncing';
  updateSyncPill();
  try{
    const { data, error } = await sb.from('app_state')
      .select('data, updated_at')
      .eq('user_id', session.user.id)
      .maybeSingle();
    if(error) throw error;

    const localTs = Date.parse(S.updatedAt || 0) || 0;
    const remoteTs = data && data.updated_at ? Date.parse(data.updated_at) : 0;

    if(!data){
      // First time in cloud -> push local
      await pushToCloud();
    }else if(isDirty() && localTs >= remoteTs){
      // Local offline changes are newer -> push
      await pushToCloud();
    }else if(remoteTs > localTs || !isDirty()){
      // Cloud is newer or local clean -> pull
      S = normalizeState(data.data);
      S.updatedAt = data.updated_at;
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){}
      setDirty(false);
      syncState = 'ok';
      lastSyncAt = new Date();
      view.ck = view.ck || currentCycleKey(S.payday);
      render();
    }else{
      syncState = 'ok';
      lastSyncAt = new Date();
    }

    // Fetch optional Apple Pay / Google Pay inbox
    try{
      const ib = await sb.from('inbox_payments')
        .select('*')
        .eq('user_id', session.user.id)
        .eq('processed', false)
        .order('created_at', { ascending: false })
        .limit(10);
      if(!ib.error && Array.isArray(ib.data)){
        inboxItems = ib.data;
        render();
      }
    }catch(e){}

    updateSyncPill();
    if(!silent) toast('Zsynchronizowano z chmurą ☁️');
  }catch(err){
    syncState = navigator.onLine ? 'error' : 'offline';
    updateSyncPill();
    if(!silent) toast('Brak połączenia z chmurą', true);
  }
}

function updateSyncPill(){
  const el = $('#syncPill');
  if(!el) return;
  el.className = 'sync-pill';
  if(syncState === 'local'){ el.textContent = '💾 Lokalnie'; }
  else if(syncState === 'syncing'){ el.textContent = '⏳ Zapis...'; el.classList.add('warn'); }
  else if(syncState === 'ok'){ el.textContent = '☁️ Chmura'; el.classList.add('ok'); }
  else if(syncState === 'offline'){ el.textContent = '📴 Offline'; el.classList.add('warn'); }
  else if(syncState === 'error'){ el.textContent = '⚠️ Błąd'; el.classList.add('bad'); }
  else { el.textContent = '☁️'; }
}

async function initAuth(){
  if(CFG.APP_NAME){
    document.title = CFG.APP_NAME;
    const at = $('#authTitle');
    if(at) at.textContent = CFG.APP_NAME;
  }
  if(!CLOUD_READY){
    render();
    return;
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });
  const { data } = await sb.auth.getSession();
  session = data ? data.session : null;
  if(session){
    $('#auth').classList.remove('open');
    render();
    pullOrSyncCloud(true);
  }else{
    $('#auth').classList.add('open');
    if(!navigator.onLine) $('#a_offline').style.display = '';
  }

  sb.auth.onAuthStateChange((ev, sess) => {
    session = sess;
    if(sess){
      $('#auth').classList.remove('open');
      render();
      pullOrSyncCloud(true);
    }else{
      $('#auth').classList.add('open');
    }
  });
}

/* ==================== CYCLE & BUDGET MATH ==================== */
function getCycle(ck){
  if(!S.cycles[ck]){
    S.cycles[ck] = {
      incomes: S.incomesTemplate.map(x => Object.assign({}, x)),
      paidFixed: {},
      closedVar: {},
      settledWeeks: {},
      transfers: [], // { id, from:'fun'|'emerg', to:'fun'|'emerg', amount, date }
      note: ''
    };
  }
  const c = S.cycles[ck];
  if(!Array.isArray(c.incomes)) c.incomes = S.incomesTemplate.map(x => Object.assign({}, x));
  if(!c.paidFixed) c.paidFixed = {};
  if(!c.closedVar) c.closedVar = {};
  if(!c.settledWeeks) c.settledWeeks = {};
  if(!Array.isArray(c.transfers)) c.transfers = [];
  if(c.note == null) c.note = '';
  return c;
}

function getWeeks(ck){
  const { start, end } = cycleBounds(ck, S.payday);
  const totalDays = diffDays(start, end) + 1;
  const base = S.budgets.weeks;
  const exps = S.expenses.filter(e => e.ck === ck && e.cat === 'food' && !e.sourcePillar);
  const cyc = getCycle(ck);
  const t = todayStr();
  const weeks = [];
  let prevBal = 0;

  for(let i = 0; i < 5; i++){
    const sIdx = i * 7;
    if(sIdx >= totalDays){
      weeks.push({idx:i, start:end, end:end, empty:true, base:0, limit:0, spent:0, bal:0, isCurrent:false, isFinished:true, settled:true});
      continue;
    }
    const eIdx = i === 4 ? totalDays - 1 : Math.min(totalDays - 1, sIdx + 6);
    const ws = addDays(start, sIdx);
    const we = addDays(start, eIdx);
    const wSpent = r2(sum(exps.filter(e => e.date >= ws && e.date <= we).map(e => e.amount)));
    const wBase = Number(base[i]) || 0;
    const carry = prevBal < 0 ? prevBal : 0;
    const wLimit = r2(wBase + carry);
    const wBal = r2(wLimit - wSpent);
    const isCurrent = (t >= ws && t <= we);
    const isFinished = (t > we);
    const daysLeft = isCurrent ? (diffDays(t, we) + 1) : 0;
    weeks.push({
      idx: i, start: ws, end: we, empty: false,
      base: wBase, limit: wLimit, spent: wSpent, bal: wBal,
      isCurrent, isFinished, daysLeft,
      settled: !!cyc.settledWeeks[i]
    });
    prevBal = wBal;
  }
  return weeks;
}

function cycleBudgets(ck){
  const cyc = getCycle(ck);
  const exps = S.expenses.filter(e => e.ck === ck && !e.sourcePillar);
  const foodSpent = r2(sum(exps.filter(e => e.cat === 'food').map(e => e.amount)));
  const funSpent = r2(sum(exps.filter(e => e.cat === 'fun').map(e => e.amount)));
  const emergSpent = r2(sum(exps.filter(e => e.cat === 'emerg').map(e => e.amount)));

  let funShift = 0, emergShift = 0;
  cyc.transfers.forEach(tr => {
    if(tr.from === 'emerg' && tr.to === 'fun'){ funShift += tr.amount; emergShift -= tr.amount; }
    if(tr.from === 'fun' && tr.to === 'emerg'){ funShift -= tr.amount; emergShift += tr.amount; }
  });

  const foodLim = r2(S.budgets.food);
  const funLim = r2(Math.max(0, S.budgets.fun + funShift));
  const emergLim = r2(Math.max(0, S.budgets.emerg + emergShift));

  // Recurring spent in this cycle
  let recSpent = 0;
  const activeRec = S.recurring.filter(r => r.enabled);
  const recDetails = activeRec.map(r => {
    if(r.mode === 'fixed'){
      const p = cyc.paidFixed[r.id];
      const spent = p && p.paid ? r2(p.amount) : 0;
      recSpent += spent;
      return { r, spent, paid: !!(p && p.paid), plan: r2(p && p.amount != null ? p.amount : r.plan) };
    }else{
      const spent = r2(sum(exps.filter(e => e.cat === r.id).map(e => e.amount)));
      recSpent += spent;
      return { r, spent, paid: !!cyc.closedVar[r.id], plan: r2(r.plan) };
    }
  });

  const totalIncome = r2(sum(cyc.incomes.map(i => i.amount)));
  const pulledToCycle = r2(sum(S.wealthMoves.filter(m => m.toCycle === ck && m.amount < 0).map(m => -m.amount)));
  const pushedToWealth = r2(sum(S.wealthMoves.filter(m => m.fromCycle === ck && m.amount > 0).map(m => m.amount)));
  const totalSpentCycle = r2(foodSpent + funSpent + emergSpent + recSpent);
  const accountLeft = r2(totalIncome + pulledToCycle - totalSpentCycle - pushedToWealth);

  return {
    foodLim, foodSpent, foodLeft: r2(foodLim - foodSpent),
    funLim, funSpent, funLeft: r2(funLim - funSpent), funShift: r2(funShift),
    emergLim, emergSpent, emergLeft: r2(emergLim - emergSpent), emergShift: r2(emergShift),
    recSpent: r2(recSpent), recDetails,
    totalIncome, pulledToCycle, pushedToWealth, totalSpentCycle, accountLeft
  };
}

/* ==================== WEALTH & CHARTS MATH ==================== */
function activePillars(){ return S.pillars.filter(p => p.enabled); }
function pillarById(id){ return S.pillars.find(p => p.id === id); }

function pillarMonthMetrics(pid, ym){
  const movesUpTo = S.wealthMoves.filter(m => m.pillarId === pid && m.ym <= ym);
  const cumDep = r2(sum(movesUpTo.map(m => m.amount)));
  const monthMoves = S.wealthMoves.filter(m => m.pillarId === pid && m.ym === ym);
  const monthDep = r2(sum(monthMoves.map(m => m.amount)));

  // Find latest valuation <= ym
  const valKeys = Object.keys(S.valuations).filter(k => k <= ym && S.valuations[k] && S.valuations[k][pid] != null).sort();
  let val = cumDep;
  let hasExactVal = false;
  if(valKeys.length){
    const lastK = valKeys[valKeys.length - 1];
    hasExactVal = (lastK === ym);
    const baseVal = Number(S.valuations[lastK][pid]) || 0;
    const afterMoves = sum(S.wealthMoves.filter(m => m.pillarId === pid && m.ym > lastK && m.ym <= ym).map(m => m.amount));
    val = r2(baseVal + afterMoves);
  }
  const profit = r2(val - cumDep);
  const hasAny = movesUpTo.length > 0 || valKeys.length > 0;
  const hasMonthActivity = monthMoves.length > 0 || hasExactVal;
  return { monthDep, cumDep, val, profit, hasExactVal, hasAny, hasMonthActivity };
}

function yearSummary(year){
  const ps = activePillars();
  const nonPPK = ps.filter(p => !p.isPPK);
  const months = [];
  for(let m = 1; m <= 12; m++){
    const ym = year + '-' + String(m).padStart(2,'0');
    let depNoPPK = 0, valNoPPK = 0, profNoPPK = 0, totalVal = 0, anyData = false, anyDataNoPPK = false;
    const perPillar = {};
    ps.forEach(p => {
      const pm = pillarMonthMetrics(p.id, ym);
      perPillar[p.id] = pm;
      totalVal += pm.val;
      if(pm.hasMonthActivity) anyData = true;
      if(!p.isPPK){
        depNoPPK += pm.cumDep;
        valNoPPK += pm.val;
        profNoPPK += pm.profit;
        if(pm.hasMonthActivity) anyDataNoPPK = true;
      }
    });
    const roi = depNoPPK > 0 ? (profNoPPK / depNoPPK) * 100 : 0;
    months.push({
      m, ym, short: MONTHS_SH[m-1], name: MONTHS_PL[m-1],
      depNoPPK: r2(depNoPPK), valNoPPK: r2(valNoPPK), profNoPPK: r2(profNoPPK),
      totalVal: r2(totalVal), roi: r2(roi), anyData, anyDataNoPPK, perPillar
    });
  }

  // Latest active month in year (or current month if in current year)
  const nowY = new Date().getFullYear(), nowM = new Date().getMonth();
  let lastIdx = -1;
  for(let i = 11; i >= 0; i--){ if(months[i].anyData){ lastIdx = i; break; } }
  const curIdx = lastIdx >= 0 ? lastIdx : (year === nowY ? nowM : 11);
  const curYM = year + '-' + String(curIdx + 1).padStart(2,'0');

  // Pillar current balances up to curYM (or latest overall for selected year)
  const pillarVals = ps.map(p => {
    const pm = pillarMonthMetrics(p.id, year + '-12');
    return Object.assign({ val: pm.val, cumDep: pm.cumDep, profit: pm.profit }, p);
  });
  const totalNetWorth = r2(sum(pillarVals.map(p => p.val)));

  // Goal calculation (countsToGoal pillars, e.g. Oszczędnościowe)
  const goalTarget = Number(S.goals[String(year)]) || 20000;
  const goalPillars = pillarVals.filter(p => p.countsToGoal);
  const goalCurrent = r2(sum((goalPillars.length ? goalPillars : pillarVals.filter(p => !p.isPPK)).map(p => p.val)));
  const goalRemaining = r2(Math.max(0, goalTarget - goalCurrent));
  let monthsLeft = 12;
  if(year === nowY) monthsLeft = Math.max(1, 12 - nowM);
  else if(year < nowY) monthsLeft = 1;
  const perMonthToGoal = r2(goalRemaining / monthsLeft);

  const curNoPPKDep = r2(sum(pillarVals.filter(p => !p.isPPK).map(p => p.cumDep)));
  const curNoPPKProf = r2(sum(pillarVals.filter(p => !p.isPPK).map(p => p.profit)));
  const curROI = curNoPPKDep > 0 ? r2((curNoPPKProf / curNoPPKDep) * 100) : 0;

  return {
    months, curIdx, curYM, pillarVals, totalNetWorth,
    goalTarget, goalCurrent, goalRemaining, monthsLeft, perMonthToGoal,
    curNoPPKDep, curNoPPKProf, curROI
  };
}

/* ==================== CATEGORY INFO ==================== */
function catInfo(catId){
  if(catId === 'food') return {id:'food', name:'Jedzenie', emoji:'🍽️', color:'#00b894'};
  if(catId === 'fun') return {id:'fun', name:'Zachcianki + piąteczki', emoji:'🎉', color:'#e84393'};
  if(catId === 'emerg') return {id:'emerg', name:'Coś nagłego', emoji:'🚨', color:'#e17055'};
  const r = S.recurring.find(x => x.id === catId);
  if(r) return {id:r.id, name:r.name, emoji:r.emoji, color:'#0984e3'};
  return {id:'other', name:'Wydatek', emoji:'🧾', color:'#636e72'};
}

function topbar(title, mode){
  let right = '';
  if(mode === 'cycle'){
    right = '<div class="msw"><button data-a="prevCycle">‹</button><span>' + esc(cycleLabel(view.ck)) + '</span><button data-a="nextCycle">›</button></div>';
  }else if(mode === 'year'){
    right = '<div class="msw yr"><button data-a="prevYear">‹</button><span>' + view.year + '</span><button data-a="nextYear">›</button></div>';
  }
  return '<div class="top"><div class="top-l"><h1>' + esc(title) + '</h1><button id="syncPill" class="sync-pill" data-a="manualSync"></button></div>' + right + '</div>';
}

    inboxItems.forEach(item => {
      h += '<div class="banner accent"><div class="bt"><b>💳 Wykryto płatność: ' + money(item.amount) + '</b>' + esc(item.merchant || 'Płatność kartą') + '</div>'

    });

    ['food','🍽️ Jedzenie'],
    ['fun','🎉 Zachcianki'],
    ['emerg','🚨 Nagłe'],
    ['all','📊 Razem']
  ];

  ).join('') + '</div>';

  if(view.startPill === 'food'){
    const over = activeW.bal < 0;
    const pct = activeW.limit > 0 ? Math.min(100, Math.max(0, (activeW.spent / activeW.limit) * 100)) : (activeW.spent > 0 ? 100 : 0);
    const subTag = activeW.isCurrent ? ('Zostało ' + activeW.daysLeft + ' dn.') : (fmtShortDate(activeW.start) + ' – ' + fmtShortDate(activeW.end));
    h += '<div class="hero' + (over ? ' over' : '') + '">'
      + '<div class="lbl"><span>Jedzenie · Tydzień ' + (activeW.idx + 1) + '</span><span>' + subTag + '</span></div>'
      + '<div class="big">' + (over ? '−' + money(-activeW.bal) : money(activeW.bal)) + '</div>'

      + '<div class="hrow"><div>Wydano w T' + (activeW.idx+1) + '<b>' + money(activeW.spent) + '</b></div><div class="r">Limit T' + (activeW.idx+1) + '<b>' + money(activeW.limit) + '</b></div></div>'
      + '<div class="hsub"><span>Cały cykl (' + fmtShortDate(bounds.start) + '–' + fmtShortDate(bounds.end) + ')</span><b>' + money(b.foodSpent) + ' / ' + money(b.foodLim) + '</b></div>'
      + '</div>';

    // Surplus banners for finished unsettled weeks
    weeks.forEach(w => {
      if(!w.empty && w.isFinished && w.bal > 0.01 && !w.settled){
        h += '<div class="banner ok"><div class="bt"><b>💰 Nadwyżka z T' + (w.idx+1) + ': +' + money(w.bal) + '</b>Kliknij, gdy przelejesz na Oszczędnościowe</div>'
          + '<button class="btn ok sm" data-a="settleWeek" data-w="' + w.idx + '" data-amt="' + w.bal + '">✓ Przelane</button></div>';
      }
    });

    // Weekly grid T1-T5
    h += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">'
      + '<b style="font-size:14.5px">Tygodniówki na jedzenie</b><span class="hint">Minus przechodzi dalej</span></div>'
      + '<div class="wgrid">' + weeks.map(w => {
        if(w.empty) return '<div class="wbox"><small>T' + (w.idx+1) + '</small><b>—</b><span>brak</span></div>';
        const cls = (w.isCurrent ? ' cur' : '') + (w.bal < 0 ? ' neg' : (w.isFinished && w.bal > 0 ? ' pos' : ''));
        const st = w.settled ? '✓ przel.' : (w.bal < 0 ? 'deficyt' : (w.isCurrent ? 'teraz' : fmtShortDate(w.start)));
        return '<div class="wbox' + cls + '"><small>T' + (w.idx+1) + '</small><b>' + (w.bal < 0 ? '−' : '') + money0(Math.abs(w.bal)) + '</b><span>' + st + '</span></div>';
      }).join('') + '</div></div>';

  }else if(view.startPill === 'fun'){
    const over = b.funLeft < 0;
    const pct = b.funLim > 0 ? Math.min(100, (b.funSpent / b.funLim) * 100) : (b.funSpent > 0 ? 100 : 0);

      + '<div class="big">' + (over ? '−' + money(-b.funLeft) : money(b.funLeft)) + '</div>'

      + '</div>';
    h += '<div class="qbtns"><button class="btn ghost" data-a="shiftBudget">⇄ Przerzuć z/do Nagłych</button><button class="btn" data-a="addExp" data-cat="fun">＋ Dodaj zachciankę</button></div>';

  }else if(view.startPill === 'emerg'){
    const over = b.emergLeft < 0;
    const pct = b.emergLim > 0 ? Math.min(100, (b.emergSpent / b.emergLim) * 100) : (b.emergSpent > 0 ? 100 : 0);
    h += '<div class="hero' + (over ? ' over' : '') + '">'
      + '<div class="lbl"><span>🚨 Coś nagłego</span><span>' + fmtShortDate(bounds.start) + '–' + fmtShortDate(bounds.end) + '</span></div>'
      + '<div class="big">' + (over ? '−' + money(-b.emergLeft) : money(b.emergLeft)) + '</div>'
      + '<div class="hbar"><i style="width:' + pct + '%"></i></div>'
      + '<div class="hrow"><div>Wydano<b>' + money(b.emergSpent) + '</b></div><div class="r">Budżet' + (b.emergShift ? ' (' + (b.emergShift>0?'+':'') + money0(b.emergShift) + ')' : '') + '<b>' + money(b.emergLim) + '</b></div></div>'
      + '</div>';
    h += '<div class="qbtns"><button class="btn ghost" data-a="shiftBudget">⇄ Przerzuć z/do Zachcianek</button><button class="btn" data-a="addExp" data-cat="emerg">＋ Dodaj nagły</button></div>';

  }else{
    const totLim = r2(b.foodLim + b.funLim + b.emergLim);
    const totSpent = r2(b.foodSpent + b.funSpent + b.emergSpent);
    const totLeft = r2(totLim - totSpent);
    const over = totLeft < 0;
    const pct = totLim > 0 ? Math.min(100, (totSpent / totLim) * 100) : 0;
    h += '<div class="hero' + (over ? ' over' : '') + '">'
      + '<div class="lbl"><span>📊 Wszystkie zmienne razem</span><span>' + fmtShortDate(bounds.start) + '–' + fmtShortDate(bounds.end) + '</span></div>'
      + '<div class="big">' + (over ? '−' + money(-totLeft) : money(totLeft)) + '</div>'
      + '<div class="hbar"><i style="width:' + pct + '%"></i></div>'
      + '<div class="hrow"><div>Wydano łącznie<b>' + money(totSpent) + '</b></div><div class="r">Łączny budżet<b>' + money(totLim) + '</b></div></div>'
      + '</div>';

    const rows = [
      ['🍽️','Jedzenie', b.foodSpent, b.foodLim, '#00b894', 'food'],
      ['🎉','Zachcianki + piąteczki', b.funSpent, b.funLim, '#e84393', 'fun'],
      ['🚨','Coś nagłego', b.emergSpent, b.emergLim, '#e17055', 'emerg']
    ];
    h += '<div class="card">' + rows.map(r => {
      const left = r2(r[3] - r[2]);
      const p = r[3] > 0 ? Math.min(100, (r[2]/r[3])*100) : 0;
      const col = p >= 100 ? 'var(--bad)' : (p >= 80 ? 'var(--warn)' : r[4]);
      return '<div style="margin-bottom:13px" data-a="startPill" data-v="' + r[5] + '" role="button">'
        + '<div style="display:flex;justify-content:space-between;font-size:13.5px"><b>' + r[0] + ' ' + r[1] + '</b>'
        + '<b style="color:' + (left<0?'var(--bad)':'var(--text)') + '">' + (left<0?'−'+money(-left):money(left)) + '</b></div>'
        + '<div class="hint" style="margin-top:1px">Wydano ' + money(r[2]) + ' z ' + money(r[3]) + '</div>'
        + '<div class="bar"><i style="width:' + p + '%;background:' + col + '"></i></div></div>';
    }).join('') + '</div>';
  }

  // Recent expenses in cycle
  const recent = S.expenses.filter(e => e.ck === ck).sort((a,b) => b.date.localeCompare(a.date)).slice(0,5);
  h += '<div class="sec"><h2>Ostatnie w tym cyklu</h2><button data-a="tab" data-v="exp">Wszystkie ›</button></div>';
  if(!recent.length){
    h += '<div class="card"><div class="empty" style="padding:20px 10px"><b>🌱</b>Czysta karta na ten cykl.<br>Stuknij duży <b>＋</b> na dole, aby dodać pierwszy wydatek.</div></div>';
  }else{
    h += '<div class="card" style="padding:4px 15px">' + recent.map(e => renderExpenseRow(e)).join('') + '</div>';
  }
  return h;
}

function niceAxisMax(v){
  if(!(v > 0)) return 1000;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / pow;
  let step = 1;
  if(norm <= 1.2) step = 1.2;
  else if(norm <= 1.5) step = 1.5;
  else if(norm <= 2) step = 2;
  else if(norm <= 2.5) step = 2.5;
  else if(norm <= 3) step = 3;
  else if(norm <= 4) step = 4;
  else if(norm <= 5) step = 5;
  else if(norm <= 6) step = 6;
  else if(norm <= 8) step = 8;
  else step = 10;
  return step * pow;
}

function fmtAxisVal(v){
  if(v <= 0) return '0';
  if(v >= 1000000) return (v / 1000000).toFixed(1).replace('.0','') + ' mln';
  if(v >= 1000) return (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1).replace('.',',') + ' tys.';
  return String(Math.round(v));
}

function renderWealthGroupedChart(ys, year, selM){
  const months = ys.months;
  const nowY = new Date().getFullYear(), nowM = new Date().getMonth();

  // Pokazuj słupki WYŁĄCZNIE do ostatniego miesiąca, w którym realnie wpisano wpłatę lub wycenę.
  // Przyszłe miesiące (albo bieżący miesiąc przed pierwszą wpłatą) pozostają całkowicie puste.
  let lastEnteredIdx = -1;
  for(let i = 11; i >= 0; i--){
    if(months[i].anyDataNoPPK){ lastEnteredIdx = i; break; }
  }

  const activeFlags = months.map((m, i) => {
    if(lastEnteredIdx < 0) return false;
    if(i > lastEnteredIdx) return false;
    // Nie rysuj pustych miesięcy sprzed pierwszej wpłaty, ale pokaż ciągłość po pierwszej wpłacie
    return m.anyDataNoPPK || m.depNoPPK > 0 || m.valNoPPK > 0;
  });

  // Punkty do linii trendu (regresja liniowa OLS po "Wpłaty z zyskiem")
  const pts = [];
  months.forEach((m, i) => {
    if(activeFlags[i]) pts.push({ x: i, y: Math.max(0, m.valNoPPK) });
  });

  let slope = 0, intercept = 0, hasTrend = pts.length >= 2;
  if(hasTrend){
    const n = pts.length;
    const sx = sum(pts.map(p => p.x));
    const sy = sum(pts.map(p => p.y));
    const sxy = sum(pts.map(p => p.x * p.y));
    const sx2 = sum(pts.map(p => p.x * p.x));
    const denom = n * sx2 - sx * sx;
    if(denom !== 0){
      slope = (n * sxy - sx * sy) / denom;
      intercept = (sy - slope * sx) / n;
    }else{
      hasTrend = false;
    }
  }

  // Skala osi Y dopasowana do aktywnych miesięcy
  let rawMax = 0;
  months.forEach((m, i) => {
    if(activeFlags[i]){
      rawMax = Math.max(rawMax, m.depNoPPK, m.valNoPPK);
    }
  });
  if(hasTrend){
    const yStart = slope * pts[0].x + intercept;
    const yEnd = slope * pts[pts.length - 1].x + intercept;
    rawMax = Math.max(rawMax, yStart, yEnd);
  }
  const maxVal = niceAxisMax(rawMax > 0 ? rawMax * 1.08 : 1000);

  // Współrzędne SVG
  const W = 360, H = 178;
  const plotTop = 18, plotBot = 148, plotH = plotBot - plotTop;
  const colW = W / 12; // 30
  const yOf = v => plotBot - Math.max(0, Math.min(1.15, v / maxVal)) * plotH;

  let svg = '<svg class="gchart-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">'
    + '<defs>'
    +   '<linearGradient id="gcDep" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent2)"/><stop offset="100%" stop-color="var(--accent)"/></linearGradient>'
    +   '<linearGradient id="gcVal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#55efc4"/><stop offset="100%" stop-color="#00b894"/></linearGradient>'
    +   '<clipPath id="gcClip"><rect x="0" y="' + (plotTop - 6) + '" width="' + W + '" height="' + (plotH + 8) + '"/></clipPath>'
    + '</defs>';

  // Poziome linie siatki i podpisy osi
  [0, 0.25, 0.5, 0.75, 1].forEach(frac => {
    const gy = (plotBot - frac * plotH).toFixed(1);
    const isBase = frac === 0;
    svg += '<line x1="0" y1="' + gy + '" x2="' + W + '" y2="' + gy + '" stroke="var(--line)" stroke-width="' + (isBase ? '1.3' : '0.9') + '"' + (isBase ? '' : ' stroke-dasharray="3 3"') + '/>';
    if(frac === 0.5 || frac === 1){
      svg += '<text x="2" y="' + (Number(gy) - 3).toFixed(1) + '" font-size="8.5" font-weight="700" fill="var(--muted)" opacity="0.82">' + esc(fmtAxisVal(maxVal * frac)) + '</text>';
    }
  });

  // 12 kolumn miesięcy — słupki rysowane TYLKO dla miesięcy z wpłatami/wyceną
  months.forEach((m, idx) => {
    const x0 = idx * colW;
    const cx = x0 + colW / 2;
    const sel = idx === view.selMonthIdx;
    const active = activeFlags[idx];
    const isFuture = (year > nowY) || (year === nowY && idx > nowM);

    svg += '<g class="gchart-col" data-a="selMonth" data-i="' + idx + '">';
    if(sel){
      svg += '<rect x="' + (x0 + 2) + '" y="' + (plotTop - 6) + '" width="' + (colW - 4) + '" height="' + (H - plotTop + 4) + '" rx="8" fill="var(--accent)" fill-opacity="0.11" stroke="var(--accent)" stroke-opacity="0.35" stroke-width="1"/>';
    }

    if(active){
      const depV = Math.max(0, m.depNoPPK);
      const valV = Math.max(0, m.valNoPPK);
      const depH = depV > 0 ? Math.max(4, (depV / maxVal) * plotH) : 3;
      const valH = valV > 0 ? Math.max(4, (valV / maxVal) * plotH) : 3;
      const depY = plotBot - depH;
      const valY = plotBot - valH;

      // Lewy słupek: Wpłaty
      svg += '<rect x="' + (cx - 9.5) + '" y="' + depY.toFixed(1) + '" width="8.5" height="' + depH.toFixed(1) + '" rx="2.6" fill="url(#gcDep)"/>';
      // Prawy słupek: Wpłaty z zyskiem
      svg += '<rect x="' + (cx + 1) + '" y="' + valY.toFixed(1) + '" width="8.5" height="' + valH.toFixed(1) + '" rx="2.6" fill="url(#gcVal)"/>';
    }

    // Etykieta miesiąca (przyszłe miesiące lekko przygaszone)
    const lblOpacity = (!active && isFuture && !sel) ? ' opacity="0.52"' : '';
    svg += '<text x="' + cx + '" y="' + (H - 9) + '" text-anchor="middle" font-size="9.2" font-weight="' + (sel ? '800' : '700') + '" fill="' + (sel ? 'var(--accent)' : 'var(--muted)') + '"' + lblOpacity + '>' + m.short + '</text>';
    // Niewidoczny obszar klikalny na całą kolumnę
    svg += '<rect x="' + x0 + '" y="0" width="' + colW + '" height="' + H + '" fill="transparent"/>';
    svg += '</g>';
  });

  // Linia trendu — rysowana wyłącznie po miesiącach z realnymi danymi (bez ciągnięcia po pustych przyszłych)
  if(hasTrend){
    const x1Idx = pts[0].x;
    const x2Idx = pts[pts.length - 1].x;
    const x1 = x1Idx * colW + colW / 2;
    const x2 = x2Idx * colW + colW / 2;
    const y1 = Math.max(plotTop, Math.min(plotBot, yOf(slope * x1Idx + intercept)));
    const y2 = Math.max(plotTop, Math.min(plotBot, yOf(slope * x2Idx + intercept)));

    svg += '<g clip-path="url(#gcClip)" style="pointer-events:none">';
    // Kontrastowa obwódka pod linią
    svg += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--card)" stroke-width="4.6" stroke-linecap="round" opacity="0.75"/>';
    // Główna przerywana linia trendu
    svg += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--warn)" stroke-width="2.4" stroke-dasharray="5.5 3.5" stroke-linecap="round"/>';
    // Punkty krańcowe
    svg += '<circle cx="' + x1.toFixed(1) + '" cy="' + y1.toFixed(1) + '" r="3.2" fill="var(--warn)" stroke="var(--card)" stroke-width="1.5"/>';
    svg += '<circle cx="' + x2.toFixed(1) + '" cy="' + y2.toFixed(1) + '" r="3.4" fill="var(--warn)" stroke="var(--card)" stroke-width="1.5"/>';
    svg += '</g>';
  }

  svg += '</svg>';

  const selActive = activeFlags[view.selMonthIdx];
  const trendBadge = hasTrend
    ? '<span class="tag" style="background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn)">↗ ' + (slope >= 0 ? '+' : '−') + money0(Math.abs(slope)) + '/mies.</span>'
    : '';
  const roiBadge = selActive
    ? '<span class="tag ok">' + (selM.roi >= 0 ? '+' : '') + selM.roi.toFixed(2) + '%</span>'
    : '<span class="tag">Brak wpłat</span>';

  const detailVals = selActive
    ? '<div><span class="hint">Wpłaty</span><b>' + money0(selM.depNoPPK) + '</b></div>'
      + '<div><span class="hint">Wpłaty z zyskiem</span><b>' + money0(selM.valNoPPK) + '</b></div>'
      + '<div><span class="hint">Zysk</span><b style="color:' + (selM.profNoPPK>=0?'var(--ok)':'var(--bad)') + '">' + (selM.profNoPPK>=0?'+':'') + money(selM.profNoPPK) + '</b></div>'
    : '<div><span class="hint">Wpłaty</span><b style="color:var(--muted)">—</b></div>'
      + '<div><span class="hint">Wpłaty z zyskiem</span><b style="color:var(--muted)">—</b></div>'
      + '<div><span class="hint">Zysk</span><b style="color:var(--muted)">—</b></div>';

  return '<div class="card">'
    + '<div class="bar-detail">'
    +   '<div style="display:flex;justify-content:space-between;width:100%;align-items:center;gap:6px;flex-wrap:wrap">'
    +     '<b style="font-size:14px">' + selM.name + ' ' + year + '</b>'
    +     '<div style="display:flex;gap:5px;align-items:center">' + trendBadge + roiBadge + '</div>'
    +   '</div>'
    +   '<div class="bar-detail-grid">' + detailVals + '</div>'
    + '</div>'
    + '<div class="barchart-wrap">' + svg + '</div>'
    + '<div class="gchart-leg">'
    +   '<span><i class="gchart-sw" style="background:var(--accent)"></i> Wpłaty</span>'
    +   '<span><i class="gchart-sw" style="background:var(--ok)"></i> Wpłaty z zyskiem</span>'
    +   '<span><i class="gchart-ln"></i> Linia trendu</span>'
    + '</div>'
    + '</div>';
}

function renderPieChart(pillars){
  const pos = pillars.filter(p => p.val > 0);
  const total = sum(pos.map(p => p.val));
  if(total <= 0){
    return '<div class="empty" style="padding:16px">Wpisz pierwsze oszczędności, aby zobaczyć wykres portfela.</div>';
  }
  const R = 54, C = 2 * Math.PI * R;
  let offset = 0;
  const circles = pos.map(p => {
    const frac = p.val / total;
    const len = frac * C;
    const svg = '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + p.color + '" stroke-width="22" stroke-dasharray="' + len.toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '"/>';
    offset += len;
    return svg;
  }).join('');

  const leg = pos.map(p => {
    const pct = Math.round((p.val / total) * 100);
    return '<div class="pie-item"><span class="pie-dot" style="background:' + p.color + '"></span>'
      + '<span>' + esc(p.emoji) + ' ' + esc(p.name) + ' <span class="hint">(' + pct + '%)</span></span>'
      + '<b>' + money0(p.val) + '</b></div>';
  }).join('');

  return '<div class="pie-wrap">'
    + '<svg width="140" height="140" viewBox="0 0 140 140" style="transform:rotate(-90deg);flex:none">' + circles + '</svg>'
    + '<div class="pie-leg">' + leg + '</div></div>';
}

/* ==================== SHEET & TOAST ==================== */
let sSave = null, sDel = null;
function openSheet(o){
  $('#sheetT').textContent = o.title;
  $('#sheetB').innerHTML = o.body;
  $('#sheetOk').textContent = o.ok || 'Zapisz';
  $('#sheetDel').style.display = o.del ? '' : 'none';
  sSave = o.save || null;
  sDel = o.del || null;
  $('#sheet').classList.add('open');
  document.body.classList.add('so');
  if(o.onOpen) o.onOpen();
  setTimeout(() => {
    const inp = $('#sheetB input.in:not([type=date]):not([type=month])');
    if(inp) inp.focus();
  }, 240);
}
function closeSheet(){
  $('#sheet').classList.remove('open');
  document.body.classList.remove('so');
}
function toast(msg, isBad){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('bad', !!isBad);
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('on'), 2400);
}
const val = id => ($('#'+id) || {}).value || '';
const picked = id => { const b = $('#'+id+' .on'); return b ? b.dataset.v : ''; };
function chips(id, items, sel){
  return '<div class="chips" id="' + id + '">' + items.map(it =>
    '<button type="button" data-a="chip" data-v="' + esc(it.v) + '" class="' + (it.v===sel?'on':'') + '">' + it.t + '</button>'
  ).join('') + '</div>';
}

function openExpenseSheet(id, preCat, preAmt, preNote, inboxId){
  const e = id ? S.expenses.find(x => x.id === id) : null;
  const defCat = e ? e.cat : (preCat || (view.tab === 'home' && ['food','fun','emerg'].includes(view.startPill) ? view.startPill : 'food'));
  const bounds = cycleBounds(view.ck, S.payday);
  const t = todayStr();
  const defDate = e ? e.date : ((t >= bounds.start && t <= bounds.end) ? t : bounds.start);

  const recVars = S.recurring.filter(r => r.enabled && r.mode === 'variable');
  const catItems = [
    {v:'food', t:'🍽️ Jedzenie'},
    {v:'fun', t:'🎉 Zachcianki'},
    {v:'emerg', t:'🚨 Nagłe'}
  ].concat(recVars.map(r => ({v:r.id, t:esc(r.emoji)+' '+esc(r.name)})));

  const recObj = S.recurring.find(r => r.id === defCat);
  let isShared = e ? !!e.shared : (defCat === 'food' || (recObj && recObj.defaultShared));
  const initAmt = e ? (e.shared && e.fullAmount ? e.fullAmount : e.amount) : (preAmt || '');

  openSheet({
    title: e ? 'Edytuj wydatek' : 'Nowy wydatek',
    body: '<label class="fl">Kwota z paragonu (zł)</label>'
      + '<input class="in big" id="f_amt" inputmode="decimal" placeholder="0,00" value="' + initAmt + '">'
      + '<button type="button" class="vole-box' + (isShared?' on':'') + '" id="f_vole">'
      + '<div class="vole-art" id="f_vole_art">' + (isShared ? volesCuddleSVG() : volesApartSVG()) + '</div>'
      + '<div class="vole-txt"><b>Wspólne zakupy (÷2)</b><small id="f_vole_sub"></small></div>'
      + '<div class="sw-knob"></div></button>'
      + '<label class="fl">Kategoria</label>' + chips('f_cat', catItems, defCat)
      + '<label class="fl">Opis (opcjonalnie)</label>'
      + '<input class="in" id="f_note" value="' + esc(e ? e.note : (preNote||'')) + '" placeholder="np. Biedronka, kino, paliwo">'
      + '<label class="fl">Data</label>'
      + '<input class="in" id="f_date" type="date" value="' + defDate + '">',
    onOpen(){
      const updVole = () => {
        const box = $('#f_vole');
        if(!box) return;
        const on = box.classList.contains('on');
        $('#f_vole_art').innerHTML = on ? volesCuddleSVG() : volesApartSVG();
        const a = parseNum(val('f_amt'));
        $('#f_vole_sub').textContent = on
          ? (a > 0 ? 'Twoja połowa: ' + money(a/2) + ' (z ' + money(a) + ')' : 'Norniki dzielą paragon na pół!')
          : 'Cała kwota idzie na Twój budżet';
      };
      updVole();
      $('#f_vole').addEventListener('click', () => { $('#f_vole').classList.toggle('on'); updVole(); });
      $('#f_amt').addEventListener('input', updVole);
      $('#f_cat').addEventListener('click', ev => {
        const b = ev.target.closest('button'); if(!b) return;
        const rc = S.recurring.find(x => x.id === b.dataset.v);
        const autoOn = b.dataset.v === 'food' || (rc && rc.defaultShared);
        if(!e){ $('#f_vole').classList.toggle('on', !!autoOn); updVole(); }
      });
    },
    save(){
      const raw = parseNum(val('f_amt'));
      if(!(raw > 0)){ toast('Wpisz kwotę większą od zera', true); return false; }
      const shared = $('#f_vole').classList.contains('on');
      const finalAmt = shared ? r2(raw / 2) : raw;
      const date = val('f_date') || todayStr();
      const cat = picked('f_cat') || 'food';
      const ck = cycleKeyForDate(date, S.payday);
      const wasShared = !!(e && e.shared);
      const rec = {
        id: e ? e.id : uid(),
        date, ck, cat,
        amount: finalAmt,
        fullAmount: shared ? raw : finalAmt,
        shared,
        note: val('f_note').trim(),
        sourcePillar: e ? (e.sourcePillar || null) : null
      };
      if(e) Object.assign(e, rec);
      else S.expenses.push(rec);
      view.ck = ck;
      if(inboxId) markInboxDone(inboxId);
      saveLocal();
      closeSheet();
      render();
      if(shared && (!e || !wasShared)){
        showVolePop(finalAmt, raw);
      }else{
        toast(e ? 'Zapisano zmiany' : 'Dodano: ' + money(finalAmt));
      }
    },
    del: e ? () => {
      S.expenses = S.expenses.filter(x => x.id !== e.id);
      saveLocal(); closeSheet(); render(); toast('Usunięto wydatek');
    } : null
  });
}

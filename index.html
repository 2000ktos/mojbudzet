        amount: a, note: val('f_note').trim() || 'Wpłata',
        fromCycle: fromCyc, toCycle: null
      });
      saveLocal(); closeSheet(); render(); toast('Wpłacono +' + money(a));
    }
  });
}

function openWealthOutSheet(){
  const ps = activePillars();
  if(!ps.length){ toast('Brak aktywnych filarów', true); return; }
  const ys = yearSummary(view.year);
  const balMap = {}; ys.pillarVals.forEach(p => balMap[p.id] = p.val);
  openSheet({
    title: '− Wyjmij z oszczędności',
    body: '<label class="fl">Skąd wyjmujesz?</label>' + chips('f_p', ps.map(p => ({v:p.id, t:esc(p.emoji)+' '+esc(p.name)+' ('+money0(balMap[p.id]||0)+')'})), ps[0].id)
      + '<label class="fl">Kwota do wyjęcia (zł)</label><input class="in big" id="f_amt" inputmode="decimal" placeholder="0,00">'
      + '<label class="fl">Gdzie idą te pieniądze? (domknięcie bilansu)</label>'
      + chips('f_dest', [
        {v:'cycle', t:'💳 Na konto bieżące (do cyklu)'},
        {v:'expense', t:'🧾 Bezpośredni wydatek ze skarbonki'},
        {v:'transfer', t:'🔄 Transfer na inny filar'}
      ], 'cycle')
      + '<div id="f_tr_wrap" style="display:none"><label class="fl">Filar docelowy</label>' + chips('f_p2', ps.map(p => ({v:p.id, t:esc(p.emoji)+' '+esc(p.name)})), (ps[1]||ps[0]).id) + '</div>'
      + '<label class="fl">Powód / opis</label><input class="in" id="f_note" placeholder="np. wakacje, opony, mechanik">'
      + '<label class="fl">Data</label><input class="in" id="f_date" type="date" value="' + todayStr() + '">',
    onOpen(){
      $('#f_dest').addEventListener('click', () => {
        setTimeout(() => { $('#f_tr_wrap').style.display = picked('f_dest') === 'transfer' ? '' : 'none'; }, 10);
      });
    },
    save(){
      const a = parseNum(val('f_amt'));
      if(!(a > 0)){ toast('Wpisz kwotę > 0', true); return false; }
      const d = val('f_date') || todayStr();
      const pid = picked('f_p') || ps[0].id;
      const dest = picked('f_dest') || 'cycle';
      const note = val('f_note').trim() || 'Wypłata';

      if(dest === 'transfer'){
        const pid2 = picked('f_p2');
        if(!pid2 || pid2 === pid){ toast('Wybierz inny filar docelowy', true); return false; }
        const tid = uid();
        S.wealthMoves.push({id:uid(), date:d, ym:d.slice(0,7), pillarId:pid, amount:-a, note:'Transfer → ' + (pillarById(pid2)||{}).name, transferId:tid});
        S.wealthMoves.push({id:uid(), date:d, ym:d.slice(0,7), pillarId:pid2, amount:a, note:'Transfer z ' + (pillarById(pid)||{}).name, transferId:tid});
        saveLocal(); closeSheet(); render(); toast('Przeniesiono ' + money(a));
      }else if(dest === 'expense'){
        const ck = cycleKeyForDate(d, S.payday);
        S.wealthMoves.push({id:uid(), date:d, ym:d.slice(0,7), pillarId:pid, amount:-a, note:'Wydatek: ' + note});
        S.expenses.push({id:uid(), date:d, ck, cat:'emerg', amount:a, fullAmount:a, shared:false, note, sourcePillar:pid});
        saveLocal(); closeSheet(); render(); toast('Zapisano wydatek ze skarbonki');
      }else{
        S.wealthMoves.push({id:uid(), date:d, ym:d.slice(0,7), pillarId:pid, amount:-a, note, toCycle:view.ck});
        saveLocal(); closeSheet(); render(); toast('Przelano +' + money(a) + ' do bilansu cyklu');
      }
    }
  });
}

function openMonthEntrySheet(mNum){
  const ps = activePillars();
  const y = view.year;
  const ym = y + '-' + String(mNum).padStart(2,'0');
  const mName = MONTHS_PL[mNum - 1] + ' ' + y;
  let body = '<div class="hint" style="margin-bottom:10px">Uzupełnij wpłatę (może być z minusem) oraz realną wartość na koniec miesiąca z banku/maklera — zysk policzy się sam.</div>';
  body += '<label class="fl">Tryb wyceny końcowej</label>' + chips('f_vmode', [{v:'val', t:'🏦 Stan konta na koniec'},{v:'prof', t:'📈 Sam zysk / odsetki'}], 'val');
  ps.forEach(p => {
    const pm = pillarMonthMetrics(p.id, ym);
    const curVal = S.valuations[ym] && S.valuations[ym][p.id] != null ? S.valuations[ym][p.id] : '';
    body += '<div style="margin-top:12px;padding:12px;border-radius:16px;background:var(--track)">'
      + '<b style="font-size:14px">' + esc(p.emoji) + ' ' + esc(p.name) + '</b>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">'
      + '<div><span class="hint">Wpłata w ' + MONTHS_SH[mNum-1] + '</span><input class="in" style="background:var(--card);padding:9px" id="md_' + p.id + '" inputmode="decimal" value="' + (pm.monthDep || '') + '" placeholder="0"></div>'
      + '<div><span class="hint mval-lbl">Stan na koniec</span><input class="in" style="background:var(--card);padding:9px" id="mv_' + p.id + '" inputmode="decimal" value="' + curVal + '" placeholder="opcjonalnie"></div>'
      + '</div></div>';
  });

  openSheet({
    title: '📊 Majątek: ' + mName,
    body,
    onOpen(){
      $('#f_vmode').addEventListener('click', () => {
        setTimeout(() => {
          const isP = picked('f_vmode') === 'prof';
          document.querySelectorAll('.mval-lbl').forEach(el => el.textContent = isP ? 'Zysk / odsetki (±)' : 'Stan na koniec');
        }, 10);
      });
    },
    save(){
      const isProf = picked('f_vmode') === 'prof';
      const endDate = ym + '-28';
      ps.forEach(p => {
        const depStr = val('md_' + p.id).trim();
        const valStr = val('mv_' + p.id).trim();
        if(depStr !== ''){
          const targetDep = parseNum(depStr);
          if(isFinite(targetDep)){
            const curMonthMoves = S.wealthMoves.filter(m => m.pillarId === p.id && m.ym === ym);
            const curSum = r2(sum(curMonthMoves.map(m => m.amount)));
            const diff = r2(targetDep - curSum);
            if(Math.abs(diff) >= 0.01){
              S.wealthMoves.push({
                id: uid(), date: endDate, ym, pillarId: p.id,
                amount: diff, note: 'Wpis miesięczny (' + MONTHS_SH[mNum-1] + ')', isManualMonth: true
              });
            }
          }
        }
        if(valStr !== ''){
          const num = parseNum(valStr);
          if(isFinite(num)){
            if(!S.valuations[ym]) S.valuations[ym] = {};
            if(isProf){
              const pmNow = pillarMonthMetrics(p.id, ym);
              S.valuations[ym][p.id] = r2(pmNow.cumDep + num);
            }else{
              S.valuations[ym][p.id] = num;
            }
          }
        }
      });
      view.selMonthIdx = mNum - 1;
      saveLocal(); closeSheet(); render(); toast('Zapisano ' + mName);
    }
  });
}

function openEditMoveSheet(id){
  const mv = S.wealthMoves.find(x => x.id === id); if(!mv) return;
  openSheet({
    title: 'Edytuj ruch',
    body: '<label class="fl">Kwota (± zł)</label><input class="in big" id="f_amt" inputmode="decimal" value="' + mv.amount + '">'
      + '<label class="fl">Opis</label><input class="in" id="f_note" value="' + esc(mv.note||'') + '">'
      + '<label class="fl">Data</label><input class="in" id="f_date" type="date" value="' + mv.date + '">',
    save(){
      const a = parseNum(val('f_amt'));
      if(!isFinite(a) || a === 0){ toast('Wpisz kwotę różną od zera', true); return false; }
      mv.amount = a; mv.note = val('f_note').trim();
      mv.date = val('f_date') || mv.date; mv.ym = mv.date.slice(0,7);
      saveLocal(); closeSheet(); render(); toast('Zapisano ruch');
    },
    del(){
      S.wealthMoves = S.wealthMoves.filter(x => x.id !== id && (!mv.transferId || x.transferId !== mv.transferId));
      saveLocal(); closeSheet(); render(); toast('Usunięto ruch');
    }
  });
}

function openEditGoalSheet(){
  const y = String(view.year);
  openSheet({
    title: '🎯 Cel oszczędnościowy ' + y,
    body: '<label class="fl">Kwota celu na koniec ' + y + ' (zł)</label>'
      + '<input class="in big" id="f_goal" inputmode="decimal" value="' + (S.goals[y] || 20000) + '">'
      + '<div class="hint" style="margin-top:8px">Każdy rok ma swój osobny cel. Aplikacja sama dzieli brakującą kwotę przez liczbę pozostałych miesięcy.</div>',
    save(){
      const g = parseNum(val('f_goal'));
      if(!(g > 0)){ toast('Podaj kwotę > 0', true); return false; }
      S.goals[y] = g;
      saveLocal(); closeSheet(); render(); toast('Zapisano cel na ' + y);
    }
  });
}

function openParamsSheet(){
  openSheet({
    title: 'Parametry cyklu i budżetów',
    body: '<label class="fl">Dzień wypłaty (1–28)</label><input class="in" id="p_day" inputmode="numeric" value="' + S.payday + '">'
      + '<label class="fl">Miesięczny budżet: Jedzenie (zł)</label><input class="in" id="p_food" inputmode="decimal" value="' + S.budgets.food + '">'
      + '<label class="fl">Tygodniówki T1 / T2 / T3 / T4 / T5 (po przecinku)</label><input class="in" id="p_wks" value="' + S.budgets.weeks.join(', ') + '">'
      + '<label class="fl">Miesięczny budżet: Zachcianki + piąteczki (zł)</label><input class="in" id="p_fun" inputmode="decimal" value="' + S.budgets.fun + '">'
      + '<label class="fl">Miesięczny budżet: Coś nagłego (zł)</label><input class="in" id="p_em" inputmode="decimal" value="' + S.budgets.emerg + '">',
    save(){
      const pd = Math.max(1, Math.min(28, parseInt(val('p_day'), 10) || 10));
      const food = Math.max(0, parseNum(val('p_food')) || 0);
      const fun = Math.max(0, parseNum(val('p_fun')) || 0);
      const em = Math.max(0, parseNum(val('p_em')) || 0);
      const wks = val('p_wks').split(',').map(x => Math.max(0, parseNum(x) || 0));
      if(wks.length === 5) S.budgets.weeks = wks;
      S.payday = pd; S.budgets.food = food; S.budgets.fun = fun; S.budgets.emerg = em;
      view.ck = currentCycleKey(S.payday);
      saveLocal(); closeSheet(); render(); toast('Zapisano ustawienia');
    }
  });
}

function openRecSheet(id){
  const r = id ? S.recurring.find(x => x.id === id) : null;
  openSheet({
    title: r ? 'Edytuj opłatę cykliczną' : 'Nowa opłata cykliczna',
    body: '<label class="fl">Nazwa</label><input class="in" id="r_n" value="' + esc(r?r.name:'') + '" placeholder="np. Siłownia, Internet">'
      + '<label class="fl">Ikona (emoji)</label><input class="in" id="r_e" value="' + esc(r?r.emoji:'🔄') + '" maxlength="4">'
      + '<label class="fl">Rodzaj kwoty</label>' + chips('r_m', [{v:'fixed',t:'🔒 Stała co miesiąc'},{v:'variable',t:'📊 Zmienna (dopisuję)'}], r?r.mode:'variable')
      + '<label class="fl">Planowana kwota (zł, 0 = bez planu)</label><input class="in" id="r_p" inputmode="decimal" value="' + (r&&r.plan?r.plan:'') + '" placeholder="0">'
      + '<label class="fl">Domyślnie wspólne (÷2)?</label>' + chips('r_s', [{v:'no',t:'Nie'},{v:'yes',t:'Tak (norniki ÷2)'}], (r&&r.defaultShared)?'yes':'no'),
    save(){
      const name = val('r_n').trim(); if(!name){ toast('Podaj nazwę', true); return false; }
      const obj = {
        name, emoji: val('r_e').trim() || '🔄',
        mode: picked('r_m') || 'variable',
        plan: Math.max(0, parseNum(val('r_p')) || 0),
        defaultShared: picked('r_s') === 'yes',
        enabled: r ? r.enabled : true
      };
      if(r) Object.assign(r, obj);
      else S.recurring.push(Object.assign({id:'rec_'+uid()}, obj));
      saveLocal(); closeSheet(); render(); toast('Zapisano opłatę');
    },
    del: r ? () => {
      S.recurring = S.recurring.filter(x => x.id !== id);
      saveLocal(); closeSheet(); render(); toast('Usunięto opłatę');
    } : null
  });
}

function openPillarSheet(id){
  const p = id ? S.pillars.find(x => x.id === id) : null;
  openSheet({
    title: p ? 'Edytuj filar / skarbonkę' : 'Nowy filar / skarbonka',
    body: '<label class="fl">Nazwa</label><input class="in" id="pl_n" value="' + esc(p?p.name:'') + '" placeholder="np. Skarbonka: Auto">'
      + '<label class="fl">Ikona (emoji)</label><input class="in" id="pl_e" value="' + esc(p?p.emoji:'🐷') + '" maxlength="4">'
      + '<label class="fl">Kolor na wykresie</label>' + chips('pl_c', PILLAR_COLORS.map(c => ({v:c, t:'<span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:'+c+';vertical-align:-3px"></span>'})), p?p.color:PILLAR_COLORS[3])
      + '<label class="fl">Czy liczy się do Celu rocznego?</label>' + chips('pl_g', [{v:'yes',t:'✅ Tak'},{v:'no',t:'Nie (osobna skarbonka)'}], (p&&p.countsToGoal)?'yes':'no'),
    save(){
      const name = val('pl_n').trim(); if(!name){ toast('Podaj nazwę', true); return false; }
      const obj = {
        name, emoji: val('pl_e').trim() || '🐷',
        color: picked('pl_c') || PILLAR_COLORS[0],
        countsToGoal: picked('pl_g') === 'yes',
        isPPK: p ? !!p.isPPK : false,
        enabled: p ? p.enabled : true
      };
      if(p) Object.assign(p, obj);
      else S.pillars.push(Object.assign({id:'pil_'+uid()}, obj));
      saveLocal(); closeSheet(); render(); toast('Zapisano filar');
    },
    del: (p && p.id !== 'sav') ? () => {
      S.pillars = S.pillars.filter(x => x.id !== id);
      saveLocal(); closeSheet(); render(); toast('Usunięto filar');
    } : null
  });
}

async function markInboxDone(id){
  inboxItems = inboxItems.filter(x => x.id !== id);
  if(sb && session && navigator.onLine){
    try{ await sb.from('inbox_payments').update({ processed: true }).eq('id', id); }catch(e){}
  }
}

/* ==================== ACTIONS & EVENTS ==================== */
const ACTIONS = {
  tab: d => { view.tab = d.v; render(); window.scrollTo(0,0); },
  prevCycle: () => { view.ck = shiftCycle(view.ck, -1); render(); },
  nextCycle: () => { view.ck = shiftCycle(view.ck, 1); render(); },
  prevYear: () => { view.year--; render(); },
  nextYear: () => { view.year++; render(); },
  startPill: d => { view.startPill = d.v; render(); },
  expFilter: d => { view.expFilter = d.v; render(); },
  selMonth: d => { view.selMonthIdx = Number(d.i); render(); },

  addExp: d => openExpenseSheet(null, d.cat || null),
  editExp: d => openExpenseSheet(d.id),
  shiftBudget: () => openShiftBudgetSheet(),

  settleWeek: d => {
    const w = Number(d.w), amt = parseFloat(d.amt);
    const cyc = getCycle(view.ck);
    cyc.settledWeeks[w] = true;
    const t = todayStr();
    S.wealthMoves.push({
      id: uid(), date: t, ym: t.slice(0,7), pillarId: 'sav',
      amount: r2(amt), note: 'Nadwyżka z jedzenia (T' + (w+1) + ')',
      fromCycle: view.ck, toCycle: null
    });
    saveLocal(); render(); toast('Przelano +' + money(amt) + ' na Oszczędnościowe!');
  },

  addIncome: () => openIncomeSheet(null),
  editIncome: d => openIncomeSheet(d.id),
  editFixedBill: d => openFixedBillSheet(d.id),
  toggleFixedBill: d => {
    const r = S.recurring.find(x => x.id === d.id); if(!r) return;
    const cyc = getCycle(view.ck);
    const cur = cyc.paidFixed[d.id];
    if(cur && cur.paid){
      cyc.paidFixed[d.id] = { paid: false, amount: cur.amount };
      saveLocal(); render(); toast('Cofnięto opłacenie');
    }else if(r.plan > 0){
      cyc.paidFixed[d.id] = { paid: true, amount: r.plan };
      saveLocal(); render(); toast('Opłacono: ' + money(r.plan));
    }else{
      openFixedBillSheet(d.id);
    }
  },
  toggleVarClosed: d => {
    const cyc = getCycle(view.ck);
    cyc.closedVar[d.id] = !cyc.closedVar[d.id];
    saveLocal(); render();
  },

  wealthIn: () => openWealthInSheet(),
  wealthOut: () => openWealthOutSheet(),
  monthEntry: d => openMonthEntrySheet(Number(d.m) || 1),
  editMove: d => openEditMoveSheet(d.id),
  editGoal: () => openEditGoalSheet(),

  setTheme: d => { S.theme = d.v; saveLocal(); render(); },
  setAccent: d => { S.accent = Number(d.v); saveLocal(); render(); },
  editParams: () => openParamsSheet(),
  addRec: () => openRecSheet(null),
  editRec: d => openRecSheet(d.id),
  toggleRec: d => { const r = S.recurring.find(x => x.id === d.id); if(r){ r.enabled = !r.enabled; saveLocal(); render(); } },
  addPillar: () => openPillarSheet(null),
  editPillar: d => openPillarSheet(d.id),
  togglePillar: d => { const p = S.pillars.find(x => x.id === d.id); if(p){ p.enabled = !p.enabled; saveLocal(); render(); } },

  approveInbox: d => {
    const item = inboxItems.find(x => x.id === d.id); if(!item) return;
    openExpenseSheet(null, 'food', item.amount, item.merchant, item.id);
  },
  dismissInbox: async d => {
    await markInboxDone(d.id);
    render();
    toast('Odrzucono płatność');
  },

  manualSync: () => {
    if(!CLOUD_READY){ toast('Tryb lokalny — skonfiguruj config.js dla chmury'); return; }
    pullOrSyncCloud(false);
  },
  logout: async () => {
    if(!sb) return;
    if(!confirm('Wylogować się z konta na tym urządzeniu?')) return;
    await sb.auth.signOut();
    session = null;
    $('#auth').classList.add('open');
  },

  exportJSON: () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'budzet-kopia-' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Pobrano kopię JSON');
  },
  importJSON: () => $('#fileIn').click(),
  resetAll: () => {
    if(!confirm('Na pewno wyczyścić wszystkie dane do zera? Tej operacji nie można cofnąć.')) return;
    S = defaultState();
    saveLocal();
    view.ck = currentCycleKey(S.payday);
    render();
    toast('Wyczyszczono do zera');
  },

  chip: (d, el) => {
    [...el.parentNode.children].forEach(b => b.classList.remove('on'));
    el.classList.add('on');
  },
  sheetClose: closeSheet,
  sheetOk: () => { if(sSave && sSave() === false) return; },
  sheetDel: () => { if(sDel) sDel(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if(!el) return;
  const fn = ACTIONS[el.dataset.a];
  if(fn){ e.stopPropagation(); fn(el.dataset, el); }
});

document.addEventListener('input', e => {
  if(e.target && e.target.id === 'cycleNote'){
    getCycle(view.ck).note = e.target.value;
    saveLocal();
  }
});

$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const parsed = JSON.parse(r.result);
      if(!parsed || typeof parsed !== 'object') throw 0;
      if(confirm('Zastąpić obecne dane danymi z kopii zapasowej?')){
        S = normalizeState(parsed);
        saveLocal();
        render();
        toast('Zaimportowano kopię!');
      }
    }catch(err){ toast('Niepoprawny plik kopii JSON', true); }
    e.target.value = '';
  };
  r.readAsText(f);
});

$('#sheet').addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.tagName === 'INPUT'){
    e.preventDefault();
    $('#sheetOk').click();
  }
});

// Login button handler
$('#a_btn').addEventListener('click', async () => {
  const email = val('a_email').trim();
  const password = val('a_pass');
  const errEl = $('#authErr');
  errEl.style.display = 'none';
  if(!email || !password){ errEl.textContent = 'Wpisz email i hasło.'; errEl.style.display = 'block'; return; }
  $('#a_btn').textContent = 'Logowanie...';
  $('#a_btn').disabled = true;
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    session = data.session;
    $('#auth').classList.remove('open');
    render();
    pullOrSyncCloud(true);
  }catch(err){
    errEl.textContent = navigator.onLine ? 'Błędny email lub hasło.' : 'Brak połączenia z internetem.';
    errEl.style.display = 'block';
  }finally{
    $('#a_btn').textContent = 'Zaloguj się';
    $('#a_btn').disabled = false;
  }
});
$('#a_pass').addEventListener('keydown', e => { if(e.key === 'Enter') $('#a_btn').click(); });
$('#a_offline').addEventListener('click', () => { $('#auth').classList.remove('open'); render(); });

window.addEventListener('online', () => { if(session) pullOrSyncCloud(true); });
window.addEventListener('offline', () => { if(CLOUD_READY){ syncState = 'offline'; updateSyncPill(); } });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && session && navigator.onLine) pullOrSyncCloud(true);
});

$('#volePop').addEventListener('click', () => {
  clearTimeout(showVolePop._t);
  $('#volePop').classList.remove('open');
});

/* ==================== BOOT ==================== */
initAuth();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
